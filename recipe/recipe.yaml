context:
  version: "2.3.5"

package:
  name: ls-hpack
  version: ${{ version }}

source:
  url: https://github.com/litespeedtech/ls-hpack/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 430a1a36029e0ae1c81eaa0b2356920f1e65fde1cdd722351c671ebe513b7a96
  patches:
    - patches/0001-Use-bundled-queue.h-on-Windows.patch
    - patches/0002-Add-install-rules.patch

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage('ls-hpack', upper_bound='x.x.x') }}

tests:
  - package_contents:
      lib:
        - ls-hpack
      include:
        - lshpack.h
        - lsxpack_header.h
  - files:
      recipe:
        - test.c
    requirements:
      build:
        - ${{ compiler('c') }}
    script:
      - if: win
        then:
          - cl /nologo test.c /I%LIBRARY_INC% /link /LIBPATH:%LIBRARY_LIB% ls-hpack.lib
          - test.exe
        else:
          - $CC $CFLAGS test.c -I$PREFIX/include $LDFLAGS -L$PREFIX/lib -lls-hpack -Wl,-rpath,$PREFIX/lib -o test
          - ./test

about:
  homepage: https://github.com/litespeedtech/ls-hpack
  summary: LiteSpeed HPACK (RFC7541) Library
  description: |
    LS-HPACK provides functionality to encode and decode HTTP headers using HPACK compression mechanism specified in RFC 7541.
  license: MIT
  license_file: LICENSE
  documentation: https://github.com/litespeedtech/ls-hpack
  repository: https://github.com/litespeedtech/ls-hpack

extra:
  recipe-maintainers:
    - pavelzw
